    { q: "13. An electron and proton are accelerated through the same potential difference $V$. Given $m_p / m_e = 1837$, the ratio $\\lambda_p / \\lambda_e$ is:", options: ["(A) $1837$", "(B) $\\sqrt{1837}$", "(C) $1 / \\sqrt{1837}$", "(D) $1 / 1837$"], answer: 2 },

    { q: "17. The second line of the Balmer series is blue-green. Which electronic transition corresponds to violet radiation in Balmer series?", options: ["(A) $n=3 \\rightarrow n=2$", "(B) $n=4 \\rightarrow n=2$", "(C) $n=5 \\rightarrow n=2$", "(D) $n=6 \\rightarrow n=1$"], answer: 2 },

    { q: "27. A substance with small positive magnetic susceptibility $\\chi_m = +10^{-3}$ is classified as:", options: ["(A) Diamagnetic", "(B) Paramagnetic", "(C) Ferromagnetic", "(D) Non-magnetic"], answer: 1 },

    { q: "29. An airplane flies North through Earth's magnetic field (downward component). The wingtips develop motional emf with polarities:", options: ["(A) Left wing positive, Right wing negative", "(B) Right wing positive, Left wing negative", "(C) Both wings positive", "(D) No potential difference"], answer: 0 },
    { q: "30. In an LCR series AC circuit with $R = 100\\ \\Omega$, $X_L = 400\\ \\Omega$, and $X_C = 600\\ \\Omega$, the net impedance $Z$ is:", options: ["(A) $1000\\ \\Omega$", "(B) $200\\ \\Omega$", "(C) $100\\sqrt{5}\\ \\Omega$", "(D) $300\\ \\Omega$"], answer: 2 },

    { q: "32. Total internal reflection occurs at an interface when light travels from denser to rarer medium and angle of incidence $i$ is:", options: ["(A) $i < i_c$", "(B) $i = i_c$", "(C) $i > i_c$", "(D) $i = 0^\\circ$"], answer: 2 },
    { q: "33. In Young's double slit experiment, if the entire apparatus is immersed in a liquid of refractive index $n = 1.2$, the new fringe width $\\beta'$ is:", options: ["(A) $1.2 \\beta$", "(B) $\\beta / 1.2$", "(C) $\\beta$", "(D) $1.44 \\beta$"], answer: 1 },

    { q: "37. Minimum excitation energy required to excite a hydrogen atom from ground state ($n=1$) to first excited state ($n=2$) is:", options: ["(A) $13.6\\text{ eV}$", "(B) $3.4\\text{ eV}$", "(C) $10.2\\text{ eV}$", "(D) $1.51\\text{ eV}$"], answer: 2 },

let currentQ = 0;
let userAnswers = new Array(quizData.length).fill(null);

function loadQuestion() {
    const item = quizData[currentQ];
    document.getElementById("quiz-progress").innerText = `Question ${currentQ + 1} of ${quizData.length}`;
    document.getElementById("question-text").innerHTML = item.q;
    
    const container = document.getElementById("options-container");
    container.innerHTML = "";
    
    item.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        if (userAnswers[currentQ] === idx) btn.classList.add("selected");
        btn.innerHTML = opt;
        btn.onclick = () => selectOption(idx);
        container.appendChild(btn);
    });

    document.getElementById("prev-btn").disabled = currentQ === 0;
    if (currentQ === quizData.length - 1) {
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("submit-btn").style.display = "inline-block";
    } else {
        document.getElementById("next-btn").style.display = "inline-block";
        document.getElementById("submit-btn").style.display = "none";
    }

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([document.getElementById("physics-quiz-container")]);
    }
}

function selectOption(idx) {
    userAnswers[currentQ] = idx;
    loadQuestion();
}

function nextQuestion() {
    if (currentQ < quizData.length - 1) {
        currentQ++;
        loadQuestion();
    }
}

function prevQuestion() {
    if (currentQ > 0) {
        currentQ--;
        loadQuestion();
    }
}

function calculateScore() {
    let score = 0;
    let reviewHtml = "<h3 class='review-header-title'>Detailed Question Review</h3>";

    quizData.forEach((item, idx) => {
        const userChoiceIdx = userAnswers[idx];
        const isCorrect = userChoiceIdx === item.answer;
        if (isCorrect) score++;

        const userChoiceText = userChoiceIdx !== null ? item.options[userChoiceIdx] : "<em>Not Attempted</em>";
        const correctChoiceText = item.options[item.answer];

        reviewHtml += `
            <div class="review-card ${isCorrect ? 'review-pass' : 'review-fail'}">
                <div class="review-q-title">${item.q}</div>
                <div class="review-ans-group">
                    <div class="given-answer ${isCorrect ? 'correct-badge' : 'incorrect-badge'}">
                        <strong>Your Answer:</strong> ${userChoiceText} ${isCorrect ? '✓' : '✗'}
                    </div>
                    ${!isCorrect ? `<div class="correct-answer-text"><strong>Correct Answer:</strong> ${correctChoiceText}</div>` : ''}
                </div>
            </div>
        `;
    });

    document.getElementById("quiz-body").style.display = "none";
    document.getElementById("prev-btn").style.display = "none";
    document.getElementById("submit-btn").style.display = "none";
    document.getElementById("restart-btn").style.display = "inline-block";

    const scoreBoard = document.getElementById("score-board");
    scoreBoard.style.display = "block";
    scoreBoard.innerHTML = `
        <div class="score-summary">
            🎉 Quiz Completed!<br>Your Score: <strong>${score} / ${quizData.length}</strong> (${((score/quizData.length)*100).toFixed(1)}%)
        </div>
        ${reviewHtml}
    `;

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([scoreBoard]);
    }
}

function restartQuiz() {
    currentQ = 0;
    userAnswers.fill(null);
    document.getElementById("quiz-body").style.display = "block";
    document.getElementById("score-board").style.display = "none";
    document.getElementById("restart-btn").style.display = "none";
    loadQuestion();
}

loadQuestion();
</script>
